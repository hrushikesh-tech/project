apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: amdox-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/hrushikesh-tech/project.git
    targetRevision: HEAD
    path: infra/helm/amdox
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: amdox-staging
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
