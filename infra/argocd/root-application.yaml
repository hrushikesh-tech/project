apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: amdox-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hrushikesh-tech/project.git
    targetRevision: HEAD
    path: infra/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
