hosts:
  web: web.staging.amdox.example
  api: api.staging.amdox.example
  auth: auth.staging.amdox.example

ingress:
  tls:
    secretName: amdox-staging-tls

config:
  telemetryEnabled: true
  corsOrigin: https://web.staging.amdox.example
  nextPublicApiUrl: https://api.staging.amdox.example
  keycloakUrl: https://auth.staging.amdox.example
  elasticsearchNode: https://elasticsearch.staging.internal:9200
  otelExporterOtlpEndpoint: https://otel-collector.staging.internal:4318
  otelServiceNameApi: amdox-backend
  otelServiceNameWorker: amdox-api-worker
  otelServiceNameMl: amdox-ml-service
  metricsPath: /metrics
  telemetryActiveUserWindowMinutes: "15"
  telemetrySampleRatio: "1"
  awsS3Bucket: amdox-erp-assets-staging
  awsS3Endpoint: https://object-storage.staging.internal

externalServices:
  keycloak:
    url: https://auth.staging.amdox.example
  elasticsearch:
    url: https://elasticsearch.staging.internal:9200
  objectStorage:
    bucket: amdox-erp-assets-staging
    endpoint: https://object-storage.staging.internal
  otlp:
    endpoint: https://otel-collector.staging.internal:4318

web:
  replicaCount: 2
  image:
    tag: latest

api:
  replicaCount: 2
  image:
    tag: latest

apiWorker:
  replicaCount: 2
  image:
    tag: latest

mlService:
  image:
    tag: latest
