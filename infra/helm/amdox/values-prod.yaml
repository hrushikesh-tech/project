hosts:
  web: app.amdox.example
  api: api.amdox.example
  auth: auth.amdox.example

ingress:
  tls:
    secretName: amdox-prod-tls

config:
  telemetryEnabled: true
  corsOrigin: https://app.amdox.example
  nextPublicApiUrl: https://api.amdox.example
  keycloakUrl: https://auth.amdox.example
  elasticsearchNode: https://elasticsearch.prod.internal:9200
  otelExporterOtlpEndpoint: https://otel-collector.prod.internal:4318
  otelServiceNameApi: amdox-backend
  otelServiceNameWorker: amdox-api-worker
  otelServiceNameMl: amdox-ml-service
  metricsPath: /metrics
  telemetryActiveUserWindowMinutes: "15"
  telemetrySampleRatio: "1"
  awsS3Bucket: amdox-erp-assets-prod
  awsS3Endpoint: https://object-storage.prod.internal

externalServices:
  keycloak:
    url: https://auth.amdox.example
  elasticsearch:
    url: https://elasticsearch.prod.internal:9200
  objectStorage:
    bucket: amdox-erp-assets-prod
    endpoint: https://object-storage.prod.internal
  otlp:
    endpoint: https://otel-collector.prod.internal:4318

web:
  replicaCount: 3
  image:
    tag: latest

api:
  replicaCount: 3
  image:
    tag: latest

apiWorker:
  replicaCount: 2
  image:
    tag: latest

mlService:
  image:
    tag: latest
