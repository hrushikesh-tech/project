{{- if .Values.resourceQuota.enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "amdox.fullname" . }}-quota
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "amdox.labels" . | nindent 4 }}
spec:
  hard:
    {{- toYaml .Values.resourceQuota.hard | nindent 4 }}
{{- end }}
