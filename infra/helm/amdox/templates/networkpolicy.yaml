{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "amdox.fullname" . }}-networkpolicy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "amdox.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "amdox.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "amdox.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.web.service.port }}
        - protocol: TCP
          port: {{ .Values.api.service.port }}
        - protocol: TCP
          port: {{ .Values.mlService.service.port }}
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: {{ .Values.web.service.port }}
        - protocol: TCP
          port: {{ .Values.api.service.port }}
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        {{- range .Values.networkPolicy.egressPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
        {{- range .Values.networkPolicy.dnsPorts }}
        - protocol: UDP
          port: {{ . }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
{{- end }}
